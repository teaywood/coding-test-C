name: Notion 공부 기록 동기화

on:
  push:
    branches: [main]
    paths:
      - '프로그래머스/**'
      - '.github/scripts/notion_sync.py'
      - '.github/workflows/notion-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-study-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync submissions to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python .github/scripts/notion_sync.py
